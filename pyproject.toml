[tool.poetry]
name = "tuition-project"
version = "0.1.0"
description = ""
authors = ["Egozzar <Egozzar@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
python-dateutil = "^2.9.0.post0"
requests = "^2.32.3"
python-dotenv = "^1.1.0"
pandas = "^2.2.3"
openpyxl = "^3.1.5"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.2"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv', 'tests']

[tool.black]
line-length = 119
exclude = '''
  /(
      \.git
    | \.venv
  )/
'''

[tool.isort]
line_length = 119
multi_line_output = 1

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
